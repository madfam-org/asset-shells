apiVersion: apps/v1
kind: Deployment
metadata:
  name: asset-shells-api
  namespace: asset-shells
  labels:
    app.kubernetes.io/name: asset-shells-api
    app.kubernetes.io/part-of: asset-shells
  annotations:
    # A Secret change does not restart pods on its own (karafiel, 2026-07-30).
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: asset-shells-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: asset-shells-api
        app.kubernetes.io/part-of: asset-shells
        # enclii convention labels (switchyard selects pods by these).
        app: asset-shells
        enclii.dev/service: asset-shells
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-credentials
      initContainers:
        # Schema migrations run as the schema OWNER (the Postgres addon's credentials) and grant the
        # runtime privileges to APP_DB_ROLE. The API container never sees owner credentials.
        - name: migrate
          image: ghcr.io/madfam-org/asset-shells/asset-shells-api
          command: ["python", "-m", "asset_shells.cli", "migrate"]
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: APP_DB_ROLE
              value: asset_shells_app
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  # The onboarding secret (enclii onboard default name <project>-credentials).
                  # Only this init container reads the OWNER key.
                  name: asset-shells-credentials
                  key: DATABASE_URL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
      containers:
        - name: api
          # Unpinned name on purpose: the digest pin lives in kustomization.yaml (images:).
          image: ghcr.io/madfam-org/asset-shells/asset-shells-api
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: ASSET_SHELLS_ENV
              value: production
            - name: JANUA_ISSUER
              value: https://auth.madfam.io
            - name: JANUA_AUDIENCE
              value: asset-shells-api
            - name: DB_POOL_MIN
              value: "1"
            - name: DB_POOL_MAX
              value: "4"
            - name: DB_STARTUP_RETRY_SECONDS
              value: "30"
            - name: LOG_LEVEL
              value: INFO
            - name: APP_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  # The NON-OWNER runtime role's URL (docs/operator-setup.md). Same Secret, other
                  # key: the API container never receives the owner URL. No key, no start.
                  name: asset-shells-credentials
                  key: APP_DATABASE_URL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 768Mi }
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
