apiVersion: apps/v1
kind: Deployment
metadata:
  name: asset-shells-web
  namespace: asset-shells
  labels:
    app.kubernetes.io/name: asset-shells-web
    app.kubernetes.io/part-of: asset-shells
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: asset-shells-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: asset-shells-web
        app.kubernetes.io/part-of: asset-shells
        app: asset-shells-web
        enclii.dev/service: asset-shells-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: web
          image: ghcr.io/madfam-org/asset-shells/asset-shells-web
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 64Mi }
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 2
            periodSeconds: 10
      volumes:
        - name: data
          emptyDir: { sizeLimit: 16Mi }
        - name: config
          emptyDir: { sizeLimit: 16Mi }
