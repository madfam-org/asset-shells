# Alembic runs as the schema OWNER (DATABASE_URL, written by the platform's Postgres addon) in the
# migrate init container; the service itself never holds owner credentials. See migrations/env.py.
[alembic]
script_location = %(here)s/migrations
path_separator = os

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
